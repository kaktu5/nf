[tack]
recomposable = true

[shorturls]
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"

[groups]
sources.type = "fetch"
start = { fetch_mode = "build", type = "fetch" }
opt = { fetch_mode = "build", type = "fetch" }

[inputs.flake]
nixpkgs.url = "channel:nixos-unstable"
tack.url = "github:manic-systems/tack"
mnw.url = "github:gerg-l/mnw"

[inputs.sources]
blink-cmp.url = "github:saghen/blink.cmp"

[inputs.start]
blink-lib.url = "github:saghen/blink.lib"
canola-nvim.url = "github:barrettruth/canola.nvim/canola"
fidget-nvim = { url = "github:j-hui/fidget.nvim", tag = "v{version}"}
lz-n = { url = "github:lumen-oss/lz.n", tag = "v{version}"}
nvim-web-devicons.url = "github:nvim-tree/nvim-web-devicons"
oxocarbon-nvim.url = "github:nyoom-engineering/oxocarbon.nvim"
plenary-nvim = { url = "github:nvim-lua/plenary.nvim", tag = "v{version}"}

[inputs.opt]
blink-indent = { url = "github:saghen/blink.indent", tag = "v{version}"}
conform-nvim = { url = "github:stevearc/conform.nvim", tag = "v{version}"  }
nvim-colorizer-lua.url = "github:norcalli/nvim-colorizer.lua"
nvim-lint.url = "github:mfussenegger/nvim-lint"
telescope-nvim = { url = "github:nvim-telescope/telescope.nvim", tag = "v{version}"}
