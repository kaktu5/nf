[tack]
recomposable = true

[shorturls]
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"

[groups]
sources.type = "fetch"
start = { fetch_mode = "build", type = "fetch" }
opt = { fetch_mode = "build", type = "fetch" }

[inputs]
nixpkgs.url = "channel:nixos-unstable"
tack.url = "github:manic-systems/tack"
mnw.url = "github:gerg-l/mnw"

# sources
blink-cmp = { url = "github:saghen/blink.cmp", group = "sources" }

# start
blink-lib = { url = "github:saghen/blink.lib", group = "start" }
canola-nvim = { url = "github:barrettruth/canola.nvim/canola", group = "start" }
fidget-nvim = { url = "github:j-hui/fidget.nvim", tag = "v{version}", group = "start" }
lz-n = { url = "github:lumen-oss/lz.n", tag = "v{version}", group = "start" }
nvim-web-devicons = { url = "github:nvim-tree/nvim-web-devicons", group = "start" }
oxocarbon-nvim = { url = "github:nyoom-engineering/oxocarbon.nvim", group = "start" }
plenary-nvim = { url = "github:nvim-lua/plenary.nvim", tag = "v{version}", group = "start" }

# opt
blink-indent = { url = "github:saghen/blink.indent", tag = "v{version}", group = "opt" }
conform-nvim = { url = "github:stevearc/conform.nvim", tag = "v{version}", group = "opt" }
nvim-colorizer-lua = { url = "github:norcalli/nvim-colorizer.lua", group = "opt" }
nvim-lint = { url = "github:mfussenegger/nvim-lint", group = "opt" }
telescope-nvim = { url = "github:nvim-telescope/telescope.nvim", tag = "v{version}", group = "opt" }
